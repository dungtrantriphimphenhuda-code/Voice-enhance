# .github/workflows/enhance_from_issue.yml
# Triggers when a comment containing /enhance is posted on an issue.
# Downloads linked audio files AND/OR issue attachments from the comment.
# Enhances them via Adobe Podcast and replies to the issue with results.

name: "Enhance Audio from Issue Comment"

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      audio_urls:
        description: 'Comma-separated audio file URLs to enhance (optional)'
        required: false
        default: ''

permissions:
  issues: write          # required to comment on issues
  contents: read

concurrency:
  group: enhance-${{ github.event_name == 'issue_comment' && github.event.issue.number || 'manual' }}
  cancel-in-progress: false

jobs:
  enhance:
    # Run when: comment starts with /enhance, OR manual dispatch
    if: >-
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/enhance'))
      ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────
      # 1. Notify user that processing started
      # ──────────────────────────────────────────
      - name: Acknowledge comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { issue } = context.payload;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🎙️ **Adobe Podcast Enhance** — Received your request. Processing files now…`
            });

      # ──────────────────────────────────────────
      # 2. Checkout (to get workflow scripts)
      # ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 3. Download audio files from attachments + URLs
      # ──────────────────────────────────────────
      - name: Download audio files
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.url }}
          MANUAL_URLS: ${{ github.event.inputs.audio_urls }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./downloads
          token="$GITHUB_TOKEN"
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"

          # ── 3a. Download attachments from the issue comment ──
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "=== Fetching attachments from comment ==="

            # Get comment body HTML to find attachment images
            COMMENT_HTML=$(curl -sL -H "Authorization: Bearer $token" \
              "$COMMENT_URL" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print(data.get('body', ''))
          ")

            # Extract image URLs from the comment (GitHub renders attachments as images)
            # Format: https://github.com/user/repo/assets/ID/UUID
            echo "$COMMENT_HTML" | grep -oP 'https://github\.com/[^/]+/[^/]+/assets/\d+/\S+' | sort -u | while read -r asset_url; do
              filename="attachment_$(basename "$asset_url")"
              echo "Downloading attachment: $asset_url"
              curl -sL -H "Authorization: Bearer $token" \
                -o "./downloads/$filename" "$asset_url"
              if [ -s "./downloads/$filename" ]; then
                echo "  ✓ Downloaded $(du -h "./downloads/$filename" | cut -f1)"
              else
                echo "  ✗ Failed, removing"
                rm -f "./downloads/$filename"
              fi
            done
          fi

          # ── 3b. Also extract URLs from comment body or manual input ──
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL_SOURCE="$MANUAL_URLS"
          else
            URL_SOURCE="$COMMENT_BODY"
          fi

          if [ -n "$URL_SOURCE" ]; then
            echo "=== Extracting URLs from input ==="
            echo "$URL_SOURCE" | tr ',' '\n' | grep -oP 'https?://[^\s\)]+' | grep -v 'github\.com.*assets' | sort -u | while read -r url; do
              url=$(echo "$url" | xargs)  # trim whitespace
              [ -z "$url" ] && continue
              echo "Downloading: $url"
              filename=$(basename "$url" | grep -oP '[a-zA-Z0-9._-]+\.(mp3|wav|m4a|flac|ogg|oga|aac|mp4|m4v|mov|3gp|webm|3gpp)' || echo "audio_$(date +%s%N).bin")
              # Avoid duplicate names
              while [ -f "./downloads/$filename" ]; do
                filename="dup_$filename"
              done
              echo "  → $filename"
              curl -sL -o "./downloads/$filename" "$url"
              if [ -s "./downloads/$filename" ]; then
                echo "  ✓ Downloaded $(du -h "./downloads/$filename" | cut -f1)"
              else
                echo "  ✗ Failed or empty, removing"
                rm -f "./downloads/$filename"
              fi
            done
          fi

          # ── List downloaded files ──
          echo "=== Downloaded files ==="
          ls -lah ./downloads/

          file_count=$(find ./downloads -type f ! -name "*.json" | wc -l)
          echo "file_count=$file_count" >> $GITHUB_OUTPUT

          if [ "$file_count" -eq 0 ]; then
            echo "❌ No audio files found. Make sure you attached files or provided valid URLs."
            exit 1
          fi

      # ──────────────────────────────────────────
      # 4. Restore auth.json from secret
      # ──────────────────────────────────────────
      - name: Restore auth.json from secret
        run: |
          mkdir -p ./auth
          echo "${{ secrets.AUTH_JSON }}" > ./auth/auth.json
          python3 -c "import json; json.load(open('./auth/auth.json'))" && \
            echo "✓ auth.json is valid JSON" || \
            { echo "✗ auth.json is NOT valid JSON"; exit 1; }

      # ──────────────────────────────────────────
      # 5. Set up Python
      # ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ──────────────────────────────────────────
      # 6. Install Playwright & dependencies
      # ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium --with-deps

      # ──────────────────────────────────────────
      # 7. Run enhancement
      # ──────────────────────────────────────────
      - name: Enhance audio files via Adobe Podcast
        run: |
          mkdir -p ./enhanced
          python3 scripts/enhance.py \
            --input-dir ./downloads \
            --output-dir ./enhanced \
            --auth-json ./auth/auth.json

      # ──────────────────────────────────────────
      # 8. Upload enhanced files as artifact
      # ──────────────────────────────────────────
      - name: Upload enhanced files as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-audio-${{ github.event_name == 'issue_comment' && format('issue-{0}', github.event.issue.number) || 'manual' }}
          path: ./enhanced/
          if-no-files-found: warn

      # ──────────────────────────────────────────
      # 9. Comment result back on the issue
      # ──────────────────────────────────────────
      - name: Post result comment on issue
        if: always() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          RESULTS_FILE: ./enhanced/results.json
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { issue } = context.payload;

            let body = "";
            try {
              const data = JSON.parse(fs.readFileSync(process.env.RESULTS_FILE, 'utf8'));
              const { total, success, failed } = data.summary;
              const artifactLink = `https://github.com/${process.env.REPO}/actions/runs/${process.env.RUN_ID}`;

              if (success > 0 && failed === 0) {
                body = `✅ **Enhance Complete**\n\n` +
                  `| Metric | Count |\n|---|---|\n` +
                  `| Total files | ${total} |\n` +
                  `| Enhanced | ${success} |\n` +
                  `| Failed | ${failed} |\n\n` +
                  `📦 [Download enhanced files](${artifactLink})\n\n` +
                  `_Files are prefixed with \`enhanced_\` and retain their original extension._`;
              } else {
                const details = data.files
                  .filter(f => f.status !== 'success')
                  .map(f => `- **${f.file}**: ${f.error || f.status}`)
                  .join('\n');

                body = `⚠️ **Enhance Partial / Failed**\n\n` +
                  `| Metric | Count |\n|---|---|\n` +
                  `| Total files | ${total} |\n` +
                  `| Enhanced | ${success} |\n` +
                  `| Failed | ${failed} |\n\n`;

                if (details) {
                  body += `**Errors:**\n${details}\n\n`;
                }
                if (success > 0) {
                  body += `📦 [Download successful files](${artifactLink})\n\n`;
                }
                body += `_Check the [workflow logs](${artifactLink}) for details._`;
              }
            } catch (err) {
              body = `❌ **Enhance Failed**\n\nCould not read results: ${err.message}\n\n` +
                `Check the [workflow logs](https://github.com/${process.env.REPO}/actions/runs/${process.env.RUN_ID}) for details.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: body
            });
