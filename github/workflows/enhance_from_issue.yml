# .github/workflows/enhance_from_issue.yml
# Triggers when a comment containing /enhance is posted on an issue.
# Downloads linked audio files, enhances them via Adobe Podcast,
# and replies to the issue with results.

name: "Enhance Audio from Issue Comment"

on:
  issue_comment:
    types: [created]

permissions:
  issues: write          # required to comment on issues
  contents: read

concurrency:
  group: enhance-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  enhance:
    # Only run when the comment body starts with /enhance
    if: startsWith(github.event.comment.body, '/enhance')
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────
      # 1. Notify user that processing started
      # ──────────────────────────────────────────
      - name: Acknowledge comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { issue, comment } = context.payload;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🎙️ **Adobe Podcast Enhance** — Received your request. Processing files now…`
            });

      # ──────────────────────────────────────────
      # 2. Checkout (to get workflow scripts)
      # ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 3. Extract URLs and download audio files
      # ──────────────────────────────────────────
      - name: Parse comment for URLs and download files
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p ./downloads
          # Extract all URLs from the comment body
          # Supports http/https URLs; ignores the /enhance keyword
          echo "$COMMENT_BODY" | \
            grep -oP 'https?://[^\s\)]+' | \
            grep -v '^https?://github\.com' | \
            while read -r url; do
              echo "Downloading: $url"
              # Determine filename from URL or use a fallback
              filename=$(basename "$url" | grep -oP '[a-zA-Z0-9._-]+\.(mp3|wav|m4a|flac|ogg|oga|aac|mp4|m4v|mov|3gp|webm|3gpp)' || echo "audio_$(date +%s%N).bin")
              echo "  → $filename"
              curl -L -s -o "./downloads/$filename" "$url"
              if [ -s "./downloads/$filename" ]; then
                echo "  ✓ Downloaded $(du -h "./downloads/$filename" | cut -f1)"
              else
                echo "  ✗ Failed or empty download, removing"
                rm -f "./downloads/$filename"
              fi
            done

          # List downloaded files
          echo "=== Downloaded files ==="
          ls -lah ./downloads/

          # Count files
          file_count=$(find ./downloads -type f ! -name "*.json" | wc -l)
          echo "file_count=$file_count" >> $GITHUB_OUTPUT

          if [ "$file_count" -eq 0 ]; then
            echo "❌ No audio files could be downloaded from the comment."
            exit 1
          fi

      # ──────────────────────────────────────────
      # 4. Restore auth.json from secret
      # ──────────────────────────────────────────
      - name: Restore auth.json from secret
        run: |
          mkdir -p ./auth
          echo "${{ secrets.AUTH_JSON }}" > ./auth/auth.json
          # Verify it's valid JSON
          python3 -c "import json; json.load(open('./auth/auth.json'))" && \
            echo "✓ auth.json is valid JSON" || \
            { echo "✗ auth.json is NOT valid JSON"; exit 1; }

      # ──────────────────────────────────────────
      # 5. Set up Python
      # ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ──────────────────────────────────────────
      # 6. Install Playwright & dependencies
      # ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium --with-deps

      # ──────────────────────────────────────────
      # 7. Run enhancement
      # ──────────────────────────────────────────
      - name: Enhance audio files via Adobe Podcast
        run: |
          mkdir -p ./enhanced
          python3 scripts/enhance.py \
            --input-dir ./downloads \
            --output-dir ./enhanced \
            --auth-json ./auth/auth.json

      # ──────────────────────────────────────────
      # 8. Upload enhanced files as artifact
      # ──────────────────────────────────────────
      - name: Upload enhanced files as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-audio-issue-${{ github.event.issue.number }}
          path: ./enhanced/
          if-no-files-found: warn

      # ──────────────────────────────────────────
      # 9. Comment result back on the issue
      # ──────────────────────────────────────────
      - name: Post result comment on issue
        if: always()
        uses: actions/github-script@v7
        env:
          RESULTS_FILE: ./enhanced/results.json
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { issue } = context.payload;

            let body = "";
            try {
              const data = JSON.parse(fs.readFileSync(process.env.RESULTS_FILE, 'utf8'));
              const { total, success, failed } = data.summary;
              const artifactLink = `https://github.com/${process.env.REPO}/actions/runs/${process.env.RUN_ID}`;

              if (success > 0 && failed === 0) {
                body = `✅ **Enhance Complete**\n\n` +
                  `| Metric | Count |\n|---|---|\n` +
                  `| Total files | ${total} |\n` +
                  `| Enhanced | ${success} |\n` +
                  `| Failed | ${failed} |\n\n` +
                  `📦 [Download enhanced files](${artifactLink}) (artifact: \`enhanced-audio-issue-${issue.number}\`)\n\n` +
                  `_Files are prefixed with \`enhanced_\` and retain their original extension._`;
              } else {
                const details = data.files
                  .filter(f => f.status !== 'success')
                  .map(f => `- **${f.file}**: ${f.error || f.status}`)
                  .join('\n');

                body = `⚠️ **Enhance Partial / Failed**\n\n` +
                  `| Metric | Count |\n|---|---|\n` +
                  `| Total files | ${total} |\n` +
                  `| Enhanced | ${success} |\n` +
                  `| Failed | ${failed} |\n\n`;

                if (details) {
                  body += `**Errors:**\n${details}\n\n`;
                }
                if (success > 0) {
                  body += `📦 [Download successful files](${artifactLink})\n\n`;
                }
                body += `_Check the [workflow logs](${artifactLink}) for details._`;
              }
            } catch (err) {
              body = `❌ **Enhance Failed**\n\nCould not read results: ${err.message}\n\n` +
                `Check the [workflow logs](https://github.com/${process.env.REPO}/actions/runs/${process.env.RUN_ID}) for details.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: body
            });
