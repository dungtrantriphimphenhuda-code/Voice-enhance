[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "voice-enhance"
version = "0.1.0"
description = "Studio-grade voice enhancement: Denoise → Restore → DSP → Normalize"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "resampy>=0.4",
]

[project.scripts]
voice-enhance = "voice_enhance.__main__:main"

[tool.setuptools.packages.find]
include = ["voice_enhance*"]
